{% load static %}
<link rel="stylesheet" href="{% static 'core/userdash.css' %}">

<!DOCTYPE html>
<html>
<head>
  <title>EMI Calculator</title>
<style>
.sidebar {
    width: 240px;
    background: #1e293b;
    color: #fff;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 22px;
}

.sidebar a {
    display: block;
    padding: 12px 15px;
    color: #cbd5e1;
    text-decoration: none;
    border-radius: 6px;
    margin-bottom: 8px;
    transition: 0.3s;
}

.sidebar a:hover,
.sidebar a.active {
    background: #2563eb;
    color: #fff;
}

.logout-btn {
    margin-top: 30px;
    background: #dc2626;
    color: white !important;
}
 
.emi-box {
    max-width: 450px;
    margin: 0 auto;
    background: #ffffff;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

.emi-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 15px;
}

.emi-box input:focus {
    outline: none;
    border-color: #2563eb;
}

.emi-box button {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.emi-box button:hover {
    background: #1e40af;
}

.emi-result {
    margin-top: 20px;
    font-size: 16px;
    font-weight: 600;
    color: #0f172a;
    text-align: center;
}

</style>

</head>
<body>

<div class="sidebar">
  <h2>LMS</h2>
  <a href="{% url 'user_dashboard' %}">Dashboard</a>
  <a href="{% url 'apply_loan' %}">Apply Loan</a>
  <a href="{% url 'loan_status' %}">Loan Status</a>
  <a href="{% url 'loan_history' %}">Loan History</a>
  <a class="active" href="{% url 'emi_calculator' %}">EMI Calculator</a>
  <a href="{% url 'profile' %}">Profile</a>
  <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
</div>

<div class="main">
  <div class="topbar">
    <h2>EMI Calculator</h2>
  </div>

  <section class="section emi-box">
    <input type="number" id="principal" placeholder="Loan Amount (Rs.)">
    <input type="number" id="rate" placeholder="Interest Rate (%)">
    <input type="number" id="time" placeholder="Loan Duration (months)">
    <button onclick="calculateEMI()">Calculate EMI</button>

    <div id="emiResult" class="emi-result"></div>
  </section>
</div>

<script>
  function calculateEMI() {
    let P = document.getElementById('principal').value;
    let R = document.getElementById('rate').value / 12 / 100;
    let N = document.getElementById('time').value;

    if (P && R && N) {
      let emi = (P * R * Math.pow(1 + R, N)) / (Math.pow(1 + R, N) - 1);
      document.getElementById('emiResult').innerText =
        "Your Monthly EMI is: Rs. " + emi.toFixed(2);
    } else {
      document.getElementById('emiResult').innerText =
        "Please fill in all fields.";
    }
  }
</script>

</body>
</html>
