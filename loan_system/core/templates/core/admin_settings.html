{% load static %}

<link rel="stylesheet" href="{% static 'core/settings.css' %}">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LMS Nepal</title>
</head>

<style>

    /* Sidebar */
.sidebar {
  width: 220px;
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  background-color: #2c3e50;
  color: white;
  padding-top: 20px;
}

.sidebar .logo {
  font-size: 22px;
  text-align: center;
  margin-bottom: 30px;
  font-weight: bold;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar ul li {
  margin-bottom: 15px;
}

.sidebar ul li a {
  color: white;
  text-decoration: none;
  padding: 10px 20px;
  display: block;
}

.sidebar ul li a:hover {
  background-color: #34495e;
  border-radius: 5px;
}

.logout-btn {
  color: #e74c3c !important;
}

/* Main content */
.main-content {
  margin-left: 240px;
  padding: 20px;
}

.header h1 {
  margin-bottom: 5px;
}
.header p {
  color: #555;
  margin-bottom: 20px;
}

/* Settings sections */
.settings-section {
  margin-bottom: 40px;
  background-color: #ecf0f1;
  padding: 20px;
  border-radius: 8px;
}

/* Section headers */
.settings-section h2 {
  margin-bottom: 15px;
  color: #2c3e50;
}

/* Form inputs */
.input-group {
  margin-bottom: 15px;
}

.input-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.input-group input[type="text"],
.input-group input[type="email"],
.input-group input[type="password"],
.input-group input[type="file"] {
  width: 100%;
  padding: 8px 12px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

/* Checkbox groups */
.checkbox-group label {
  font-weight: normal;
}

/* Buttons */
button.save-btn {
  margin-top: 10px;
  padding: 10px 20px;
  background-color: #3498db;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button.save-btn:hover {
  background-color: #2980b9;
}

</style>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">LMS Nepal</div>
    <ul>
      <li><a href="{% url 'admin_dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'admin_loans' %}">Loans</a></li>
      <li><a href="{% url 'admin_applicants' %}">Applicants</a></li>
      <li><a href="{% url 'admin_reports' %}">Reports</a></li>
      <li><a href="{% url 'admin_settings' %}">Settings</a></li>
      <li><a href="{% url 'logout' %}" class="logout-btn">Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <h1>Settings</h1>
      <p>Update your profile, password, and preferences.</p>
    </header>

    <!-- Profile Section -->
    <section class="settings-section">
      <h2>Profile</h2>
      <form>
        <div class="input-group">
          <label for="admin_name">Name</label>
          <input type="text" id="admin_name" name="admin_name" value="Admin">
        </div>
        <div class="input-group">
          <label for="admin_email">Email</label>
          <input type="email" id="admin_email" name="admin_email" value="admin@example.com">
        </div>
        <div class="input-group">
          <label for="profile_pic">Profile Picture</label>
          <input type="file" id="profile_pic" name="profile_pic">
        </div>
        <button type="submit" class="save-btn">Save Profile</button>
      </form>
    </section>

    <!-- Password Section -->
    <section class="settings-section">
      <h2>Password</h2>
      <form>
        <div class="input-group">
          <label for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password">
        </div>
        <div class="input-group">
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password">
        </div>
        <div class="input-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password">
        </div>
        <button type="submit" class="save-btn">Update Password</button>
      </form>
    </section>

    
    <!-- Security Section -->
    <section class="settings-section">
      <h2>Security</h2>
      <form>
        <div class="input-group checkbox-group">
          <label>
            <input type="checkbox" name="two_factor">
            Enable Two-Factor Authentication (2FA)
          </label>
        </div>
        <button type="submit" class="save-btn">Update Security</button>
      </form>
    </section>

  </main>

</body>
</html>
